name: Build AHbsolute

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      AH_PACKAGE: com.ahbsolute.app
      UPSTREAM_REF: master

    steps:
      - name: Checkout AHbsolute
        uses: actions/checkout@v4

      - name: Check API credentials
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::Missing TG_API_ID or TG_API_HASH"
            exit 1
          fi

      - name: Checkout Telegram Android
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-Android
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android build packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Install Python dependencies
        run: |
          python3 -m pip install pillow

      - name: Configure Google Services
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then
            echo "$GS" > "$RUNNER_TEMP/gs.json"
            echo "GOOGLE_SERVICES_JSON_PATH=$RUNNER_TEMP/gs.json" >> "$GITHUB_ENV"
          fi

      - name: Copy AHbsolute sources
        run: |
          cp -r overlay/. upstream/

      - name: Apply AHbsolute patches
        run: |
          python3 scripts/apply_patches.py upstream

      - name: Replace launcher icons
        run: |
          python3 scripts/make_icons.py upstream

      - name: Configure release keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p upstream/TMessagesProj/config
            echo "$KS" | base64 -d > upstream/TMessagesProj/config/release.keystore
            {
              echo "RELEASE_KEY_PASSWORD=$KP"
              echo "RELEASE_KEY_ALIAS=$KA"
              echo "RELEASE_STORE_PASSWORD=$KP"
            } >> upstream/gradle.properties
          else
            echo "::warning::No custom release keystore configured"
          fi

      - name: Build Release APK
        working-directory: upstream
        run: |
          chmod +x gradlew

          if [ -d TMessagesProj_App ]; then
            MODULE=TMessagesProj_App
          else
            MODULE=TMessagesProj
          fi

          echo "Gradle module: $MODULE"

          ./gradlew ":$MODULE:assembleRelease" \
            --no-daemon \
            --parallel \
            --build-cache \
            -Pandroid.injected.build.abi=arm64-v8a,armeabi-v7a \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AHbsolute-apk
          path: upstream//build/outputs/apk//*.apk
          if-no-files-found: error
